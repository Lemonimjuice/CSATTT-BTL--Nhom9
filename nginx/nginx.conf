events {
    worker_connections 1024;
}

http {
    # ---------- Rate Limiting ----------
    # Vùng chung cho toàn bộ API: 5 request/giây mỗi IP
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;
    # [THÊM] Vùng chặt hơn cho đăng nhập, chống brute-force: 5 request/phút mỗi IP
    limit_req_zone $binary_remote_addr zone=loginlimit:10m rate=5r/m;
    limit_req_status 429;   # [THÊM] trả 429 Too Many Requests thay vì 503 mặc định

    # ---------- Load Balancing (Round-Robin) + passive health check ----------
    upstream backend_cluster {
        server backend-node-1:8080 max_fails=3 fail_timeout=10s;
        server backend-node-2:8080 max_fails=3 fail_timeout=10s;
    }

    # ---------- HTTP -> HTTPS ----------
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ---------- HTTPS (SSL Termination) ----------
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # [THÊM] Failover: node lỗi/không phản hồi thì chuyển ngay sang node kia
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # Header chung gửi xuống backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # [THÊM] Cho biết node nào đã xử lý, tiện quan sát Demo 1
        add_header X-Upstream $upstream_addr always;

        # [THÊM] Endpoint đăng nhập: rate limit chặt
        location = /api/v1/auth/login {
            limit_req zone=loginlimit burst=3 nodelay;
            proxy_pass http://backend_cluster;
        }

        location / {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_pass http://backend_cluster;
        }
    }
}