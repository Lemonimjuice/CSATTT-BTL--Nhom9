# TV2: khi đổi sang image ModSecurity, thêm dòng nạp module ở đầu file, ví dụ:
# load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
}

http {
    server_tokens off;                 # không lộ phiên bản Nginx trong header/trang lỗi
    client_max_body_size 1m;           # API JSON không cần body lớn

    # ---------- Log: có request ID và node đã xử lý, dùng làm minh chứng Demo 1 ----------
    log_format main '$remote_addr [$time_local] "$request" $status '
                    'rid=$request_id upstream=$upstream_addr '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ---------- DNS nội bộ của Docker ----------
    # Phân giải lại tên node mỗi 5s: Nginx vẫn khởi động/restart được khi một node đang tắt.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ---------- Rate Limiting ----------
    # Vùng chung cho toàn bộ API: 5 request/giây mỗi IP
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;
    # Vùng chặt hơn cho đăng nhập, chống brute-force: 5 request/phút mỗi IP
    limit_req_zone $binary_remote_addr zone=loginlimit:10m rate=5r/m;
    limit_req_status 429;   # trả 429 Too Many Requests thay vì 503 mặc định

    # ---------- Load Balancing (Round-Robin) + passive health check ----------
    upstream backend_cluster {
        zone backend_cluster 64k;      # bắt buộc khi dùng `resolve`
        server backend-node-1:8080 resolve max_fails=3 fail_timeout=10s;
        server backend-node-2:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ---------- HTTP -> HTTPS ----------
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ---------- HTTPS (SSL Termination) ----------
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # TV2: bật WAF bằng 1 dòng include (file do TV2 quản lý)
        # include /etc/nginx/modsecurity/modsec-nginx.conf;

        # Failover: node lỗi/không phản hồi thì chuyển ngay sang node kia
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Header gửi xuống backend. Nginx là điểm vào duy nhất nên ghi đè (không nối thêm)
        # X-Forwarded-For bằng IP thật, tránh client tự điền IP giả vào audit log.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mã 32 ký tự hex do Nginx sinh, backend ghi vào log để đối chiếu với log WAF
        proxy_set_header X-Request-ID $request_id;

        proxy_hide_header X-Request-ID;   # backend trả lại cùng ID, chỉ giữ 1 header do Nginx gắn
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # Cho biết node nào đã xử lý, tiện quan sát Demo 1 (chỉ dùng trong môi trường demo)
        add_header X-Upstream $upstream_addr always;

        # Endpoint đăng nhập: rate limit chặt
        location = /api/v1/auth/login {
            limit_req zone=loginlimit burst=3 nodelay;
            proxy_pass http://backend_cluster;
        }

        # Actuator: chỉ cho phép health ra ngoài, info/metrics chỉ xem được trong mạng nội bộ
        location = /actuator/health {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_pass http://backend_cluster;
        }
        location /actuator/ {
            return 404;
        }

        location / {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_pass http://backend_cluster;
        }
    }
}
