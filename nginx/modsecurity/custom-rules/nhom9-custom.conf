# HAI luật tùy chỉnh đặc thù cho ứng dụng của nhóm 9 (đề cương TV2.3).
# Dải ID 100100-100299 dành cho file này. Nạp TRƯỚC bộ luật CRS (xem main.conf).

# ---------------------------------------------------------------------------
# Custom rule 1 - Vá ảo (Virtual Patching) cho lỗ hổng SQLi đã biết:
# POST /api/v1/vuln/records/search nối chuỗi trường "keyword" vào câu SQL.
# Thay vì chờ sửa code, WAF chỉ cho phép keyword gồm chữ, số, khoảng trắng và . , _ -
# Mọi ký tự khác (dấu nháy, --, =, ngoặc...) bị chặn ngay tại biên, kể cả payload CRS bỏ sót.
# ---------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/api/v1/vuln/records/search$" \
    "id:100100,phase:2,deny,status:403,log,auditlog,t:none,\
    msg:'Virtual patch: keyword khong hop le tai endpoint SQLi da biet',\
    tag:'nhom9/virtual-patch',tag:'attack-sqli',severity:'CRITICAL',\
    chain"
    SecRule ARGS:json.keyword "!@rx ^[A-Za-z0-9 .,_-]{1,200}$" \
        "t:none,logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'"

# ---------------------------------------------------------------------------
# Custom rule 2 - Kiểm tra đầu vào cho đăng nhập/đăng ký:
# username chỉ gồm chữ cái Latin, số và _ . @ - (đúng quy ước tài khoản của hệ thống).
# Chặn sớm payload SQLi/XSS nhét vào username và chống dò tài khoản bằng chuỗi bất thường,
# trước khi request tới tầng xác thực của backend.
# ---------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/api/v1/auth/(?:login|register)$" \
    "id:100200,phase:2,deny,status:403,log,auditlog,t:none,\
    msg:'Username chua ky tu khong cho phep',\
    tag:'nhom9/input-validation',severity:'CRITICAL',\
    chain"
    SecRule ARGS:json.username "!@rx ^[A-Za-z0-9_.@-]{1,50}$" \
        "t:none,logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'"
