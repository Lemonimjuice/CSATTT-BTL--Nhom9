# Sửa từ /etc/nginx/templates/modsecurity.d/modsecurity.conf.template của image
# owasp/modsecurity-crs (libmodsecurity 3.0.17), thay biến môi trường bằng giá trị cố định.
# ---------- Bật WAF (SecRuleEngine On theo đề cương TV2.2) ----------
# Chế độ chặn mặc định. File modsecurity-mode.conf nạp ngay sau đây có thể ghi đè thành
# DetectionOnly cho Demo 3 (đặt qua biến WAF_MODE trong docker-compose).
SecRuleEngine On

# ---------- Request body: bắt buộc để quét JSON API ----------
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 512
SecArgumentsLimit 1000
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# Không quét response body: API trả JSON, tránh tốn tài nguyên và tránh ghi dữ liệu người dùng vào log
SecResponseBodyAccess Off

SecTmpDir /tmp/modsecurity/tmp
SecDataDir /tmp/modsecurity/data
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile /etc/modsecurity.d/unicode.mapping 20127

# ---------- Bộ phân tích body theo Content-Type ----------
# JSON Body Inspection: mỗi trường JSON thành một biến ARGS:json.<tên>, ví dụ ARGS:json.keyword
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
    "id:200006,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

# Body không phân tích được (JSON hỏng, cố tình lách parser) thì chặn luôn
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"
SecRule &ARGS "@ge 1000" \
    "id:200007,phase:2,t:none,log,deny,status:400,msg:'Failed to fully parse request body due to large argument count',severity:2"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation'"
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
    "id:200004,phase:2,t:none,log,deny,msg:'Multipart parser detected a possible unmatched boundary.'"
SecRule TX:/^MSC_/ "!@streq 0" \
    "id:200005,phase:2,t:none,log,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

# ---------- Audit log ----------
# Chỉ ghi giao dịch có luật khớp hoặc lỗi 5xx; 401/403 của backend không lẫn vào bằng chứng WAF.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^5"
# A: thông tin giao dịch, H: luật đã khớp, K: danh sách luật, Z: kết thúc.
# Cố ý KHÔNG ghi B/C/I (header, body request) để không lộ Authorization, JWT, mật khẩu.
SecAuditLogParts AHKZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/modsecurity/audit/modsec_audit.log

SecDebugLog /dev/null
SecDebugLogLevel 0
SecStatusEngine Off
