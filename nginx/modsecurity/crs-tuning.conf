# Tinh chỉnh OWASP CRS 4.30.0 cho REST API của nhóm. Nạp sau /opt/owasp-crs/crs-setup.conf.

# Paranoia Level 1 (mặc định), ngưỡng anomaly 5 cho request: một luật CRITICAL là đủ để chặn.
SecAction \
    "id:900000,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:tx.blocking_paranoia_level=1"
SecAction \
    "id:900110,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# Mặc định CRS 4 chỉ cho GET HEAD POST OPTIONS; API dùng thêm PUT và DELETE.
SecAction \
    "id:900200,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:'tx.allowed_methods=GET HEAD POST PUT DELETE OPTIONS'"

# API chỉ nhận JSON (cùng vài kiểu chuẩn để không chặn nhầm form/multipart thông thường).
SecAction \
    "id:900220,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |text/plain|'"

# Ngoại lệ chống false positive (tuning, không phải luật tấn công): mật khẩu và refresh token
# là chuỗi tùy ý do người dùng đặt, không đi vào câu SQL (backend băm BCrypt hoặc so khớp tham số hóa).
# Bỏ 2 trường này khỏi phạm vi quét CRS, chỉ trên các endpoint xác thực.
SecRule REQUEST_URI "@rx ^/api/v1/auth/(?:login|register|refresh|logout)$" \
    "id:900500,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.refreshToken"
