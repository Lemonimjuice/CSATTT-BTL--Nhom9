# Được nginx.conf include trong khối server HTTPS: bật ModSecurity cho mọi location.
modsecurity on;
modsecurity_rules_file /etc/nginx/modsecurity/main.conf;
# Mã giao dịch ModSecurity = request ID của Nginx: audit log WAF, log Nginx và log backend
# cùng một khóa đối chiếu.
modsecurity_transaction_id "$request_id";
