networks:
  dmz_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true          # vùng lõi: không có đường ra Internet, không publish cổng

services:
  nginx-waf:
    image: nginx:alpine     # TV2 sẽ thay bằng image có ModSecurity + OWASP CRS
    ports:
      - "80:80"             # chỉ để redirect 80 -> 443
      - "443:443"           # [SỬA] cổng HTTPS chính, trước đây chưa mở
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # [SỬA] trước đây chưa mount, nginx không đọc được chứng chỉ
    networks:
      - dmz_net
      - internal_net
    depends_on:
      - backend-node-1
      - backend-node-2
    restart: unless-stopped

  # Backend giả lập (http-echo) để kiểm thử hạ tầng; TV3 sẽ thay bằng image Spring Boot
  backend-node-1:
    image: hashicorp/http-echo
    command: -text="Response from Backend Node 1" -listen=:8080
    environment:
      JWT_SECRET: ${JWT_SECRET}       # [THÊM] 2 node dùng chung 1 secret (đọc từ file .env)
    networks:
      - internal_net

  backend-node-2:
    image: hashicorp/http-echo
    command: -text="Response from Backend Node 2" -listen=:8080
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - internal_net

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-changeme_local}
      POSTGRES_DB: blogdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    restart: unless-stopped

volumes:
  postgres_data: