# Hệ thống phòng thủ đa lớp của nhóm 9: 4 container, 2 phân vùng mạng.
# Biến môi trường đọc từ .env (tạo bằng scripts/init-env.sh). Chi tiết: docs/contract/ports-and-env.md
#
#   docker compose up -d --build --wait     # dựng toàn bộ hệ thống
#   docker compose stop backend-node-1       # Demo 1: đánh sập 1 node
#
# Lưu ý: PostgreSQL chỉ chạy database/init/*.sql khi volume postgres_data còn trống.
# Sửa SQL xong phải chạy `docker compose down -v` rồi `up` lại (mất dữ liệu cũ).

networks:
  dmz_net:
    driver: bridge            # vùng biên hướng ra Internet
  internal_net:
    driver: bridge
    internal: true            # vùng lõi: không có đường ra Internet, không publish cổng
    ipam:
      config:
        - subnet: 10.209.10.0/24   # cố định để backend chỉ tin X-Forwarded-For từ IP của Nginx

# Cấu hình chung cho 2 node: cùng image, cùng DB, cùng JWT secret (để Demo 1 không phải đăng nhập lại).
# Hai node cùng bật cụm /api/v1/vuln (bản lỗi) song song với /api/v1/secure (bản vá).
x-backend: &backend
  build: ./backend
  image: nhom9/blog-api:local
  environment:
    DB_HOST: database
    DB_PORT: "5432"
    DB_NAME: blogdb
    DB_USERNAME: ${APP_DB_USERNAME:-app_user}      # tài khoản quyền tối thiểu, KHÔNG phải postgres_admin
    DB_PASSWORD: ${APP_DB_PASSWORD:?Đặt APP_DB_PASSWORD trong .env}
    JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET (Base64 >= 32 byte) trong .env}
    SPRING_PROFILES_ACTIVE: integration,sqli-lab
    SQLI_DEMO_ENABLED: "true"                     # bật cụm /api/v1/vuln để đối chứng
    # Dữ liệu SQLi nằm ở database "sqli_lab" KHÁC trong cùng PostgreSQL, tài khoản chỉ đọc.
    # PostgreSQL không cho truy vấn chéo database, nên SQLi ở đây không chạm được bảng của blogdb.
    SQLI_DEMO_DB_URL: jdbc:postgresql://database:5432/sqli_lab
    SQLI_DEMO_DB_USERNAME: sqli_demo_reader
    SQLI_DEMO_DB_PASSWORD: ${SQLI_LAB_READER_PASSWORD:?Đặt SQLI_LAB_READER_PASSWORD trong .env}
    TRUSTED_PROXY_REGEX: '10\.209\.10\.10'        # chỉ IP của nginx-waf được báo IP client
  depends_on:
    database:
      condition: service_healthy
  healthcheck:
    test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 60s
  networks:
    - internal_net
  restart: unless-stopped   # `docker compose stop` (Demo 1) vẫn giữ node ở trạng thái tắt

services:
  nginx-waf:
    container_name: nginx-waf
    # OWASP CRS 4.30.0 + ModSecurity 3.0.17 + Nginx 1.30.6 (Alpine 3.24.2).
    # Tag ghi rõ phiên bản; digest ghim đúng một bản: Docker tải theo digest, máy ai cũng giống nhau.
    image: owasp/modsecurity-crs:4.30.0-nginx-alpine-202610180210@sha256:873ce68a658d2e3b61484a8a24d215f7d15456e7ce5aec5e7114bf000d743365
    entrypoint: [nginx, -g, "daemon off;"]   # bỏ entrypoint sinh cấu hình từ biến môi trường của image
    command: []
    ports:
      - "80:8080"           # chỉ để redirect 80 -> 443
      - "443:8443"          # cổng HTTPS chính (nginx không đặc quyền nghe 8443 trong container)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/modsecurity:/etc/nginx/modsecurity:ro
      - ./nginx/modsecurity/mode/${WAF_MODE:-On}.conf:/etc/nginx/modsecurity-mode.conf:ro
      - ./logs/nginx:/var/log/nginx                      # access log Nginx
      - ./logs/waf:/var/log/modsecurity/audit            # modsec_audit.log
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "curl -so /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      dmz_net: {}
      internal_net:
        ipv4_address: 10.209.10.10
    depends_on:
      - backend-node-1
      - backend-node-2
    restart: unless-stopped

  backend-node-1:
    <<: *backend
    container_name: backend-node-1
    volumes:
      - ./logs/backend-node-1:/app/logs   # audit log tập trung ra máy host

  backend-node-2:
    <<: *backend
    container_name: backend-node-2
    volumes:
      - ./logs/backend-node-2:/app/logs

  database:
    container_name: database
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Đặt DB_ADMIN_PASSWORD trong .env}
      POSTGRES_DB: blogdb
      # 02-least-privilege.sql đọc 2 biến này để tạo tài khoản ứng dụng
      APP_DB_USERNAME: ${APP_DB_USERNAME:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Đặt APP_DB_PASSWORD trong .env}
      # 04-sqli-demo.sh đọc biến này để tạo tài khoản chỉ-đọc cho database sqli_lab
      SQLI_LAB_READER_PASSWORD: ${SQLI_LAB_READER_PASSWORD:?Đặt SQLI_LAB_READER_PASSWORD trong .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro   # 01 schema, 02 quyền, 03 seed, 04 db sqli_lab
    healthcheck:
      # Cổng TCP chỉ mở sau khi các script init chạy xong (server init chỉ nghe qua socket)
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres_admin -d blogdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal_net
    restart: unless-stopped

volumes:
  postgres_data:
