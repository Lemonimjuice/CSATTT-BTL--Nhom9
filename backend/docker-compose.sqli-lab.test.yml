# TEST RUNNER ONLY. Merge after docker-compose.sqli-lab.yml.
# Plain HTTP relay, not a WAF or a production integration gateway.
services:
  sqli-lab-api:
    ports: !reset []

  sqli-test-gateway:
    image: nginx:1.28-alpine
    profiles: [sqli-lab]
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    volumes:
      - ./docker/test-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1::8080"
    depends_on:
      sqli-lab-api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - sqli-lab-net
      - sqli-test-edge

networks:
  sqli-test-edge:
    driver: bridge
    internal: false
