# Optional, local-only SQLi comparison lab. Always combine with docker-compose.yml.
# It adds services and never changes the running blog-api or business PostgreSQL service.
services:
  sqli-lab-db:
    image: postgres:16-alpine
    profiles: [sqli-lab]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20]
    environment:
      POSTGRES_DB: sqli_lab
      POSTGRES_USER: sqli_lab_admin
      POSTGRES_PASSWORD: ${SQLI_LAB_ADMIN_PASSWORD:?Set SQLI_LAB_ADMIN_PASSWORD in .env.sqli-lab}
      SQLI_LAB_READER_PASSWORD: ${SQLI_LAB_READER_PASSWORD:?Set SQLI_LAB_READER_PASSWORD in .env.sqli-lab}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/sqli-lab/init-demo.sh:/docker-entrypoint-initdb.d/10-init-demo.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sqli_lab_admin -d sqli_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sqli-lab-net

  sqli-lab-api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [sqli-lab]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SPRING_PROFILES_ACTIVE: prod,sqli-lab
      SQLI_DEMO_ENABLED: "true"
      SQLI_DEMO_DB_URL: jdbc:postgresql://sqli-lab-db:5432/sqli_lab
      SQLI_DEMO_DB_USERNAME: sqli_demo_reader
      SQLI_DEMO_DB_PASSWORD: ${SQLI_LAB_READER_PASSWORD:?Set SQLI_LAB_READER_PASSWORD in .env.sqli-lab}
    depends_on:
      postgres:
        condition: service_healthy
      sqli-lab-db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - blog-net
      - sqli-lab-net

networks:
  sqli-lab-net:
    internal: true
